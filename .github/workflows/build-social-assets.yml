name: Build original Social 2026 WebP assets
on:
  push:
    paths:
      - 'scripts/build_social_assets.py'
      - '.github/workflows/build-social-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Generate custom WebP assets
        run: python scripts/build_social_assets.py
      - name: Commit generated WebP graphics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/social-2026/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Build original WebP artwork for Social 2026"
            git push
          fi
